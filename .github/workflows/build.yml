name: Build Tweak

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            fakeroot \
            git \
            libtinfo6 \
            perl \
            rsync \
            unzip \
            xz-utils

      - name: Install ldid
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 \
            -o "$HOME/bin/ldid"
          chmod +x "$HOME/bin/ldid"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/ldid" --version || true

      - name: Install RootHide Theos, toolchain, and SDK
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          git clone --depth=1 --recurse-submodules \
            https://github.com/roothide/theos.git "$THEOS"

          mkdir -p "$THEOS/toolchain"
          curl -fsSL \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C "$THEOS/toolchain"

          "$THEOS/bin/install-sdk" latest

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "PATH=$THEOS/bin:$HOME/bin:$PATH" >> "$GITHUB_ENV"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -d "$THEOS/sdks" && find "$THEOS/sdks" -maxdepth 1 -name '*.sdk' -print -quit | grep -q .

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          make package FINALPACKAGE=1
          DEB_FILE="$(find "$GITHUB_WORKSPACE/packages" -type f -name '*.deb' -print -quit)"
          if [ -z "$DEB_FILE" ]; then
            echo "Error: no .deb file was generated"
            exit 1
          fi
          echo "Generated package: $DEB_FILE"
          echo "DEB_FILE=$DEB_FILE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tweak-package
          path: ${{ env.DEB_FILE }}
          if-no-files-found: error
          retention-days: 7
