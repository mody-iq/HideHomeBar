name: Build Tweak

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid

      - name: Install RootHide Theos
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --recurse-submodules https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "PATH=$HOME/theos/bin:$PATH" >> "$GITHUB_ENV"
          test -f "$HOME/theos/makefiles/common.mk"

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          make package FINALPACKAGE=1
          DEB_FILE="$(find "$GITHUB_WORKSPACE/packages" -type f -name '*.deb' -print -quit)"
          if [ -z "$DEB_FILE" ]; then
            echo "Error: no .deb file was generated"
            exit 1
          fi
          echo "Generated package: $DEB_FILE"
          echo "DEB_FILE=$DEB_FILE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tweak-package
          path: ${{ env.DEB_FILE }}
          if-no-files-found: error
          retention-days: 7
